name: Check App Reviews

on:
  schedule:
    # Run every hour
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (don't post to Slack)"
        required: false
        default: false
        type: boolean
      clear_cache:
        description: "Clear cache before running"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  APP_STORE_APPS: ${{ secrets.APP_STORE_APPS }}
  GOOGLE_PLAY_APPS: ${{ secrets.GOOGLE_PLAY_APPS }}
  MAX_REVIEWS_PER_RUN: ${{ secrets.MAX_REVIEWS_PER_RUN || '50' }}

jobs:
  check-reviews:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Restore and save reviews cache
        uses: actions/cache@v4
        with:
          path: reviews_cache.json
          key: reviews-cache-${{ github.repository }}
          restore-keys: |
            reviews-cache-

      - name: Run review checker
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.clear_cache }}" == "true" ]; then
            ARGS="$ARGS --clear-cache"
          fi
          uv run review-notifier $ARGS
